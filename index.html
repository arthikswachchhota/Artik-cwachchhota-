<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>আর্থিক স্বচ্ছতা | বাংলাদেশ</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --green: #006a4e;
      --dark-green: #004d3a;
      --light-green: #eaf6f1;
      --white: #ffffff;
      --text: #17221d;
      --muted: #66736d;
      --border: #e1e8e4;
      --bg: #f6f9f7;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI",
        "Noto Sans Bengali", Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.6;
    }

    /* Header */

    header {
      background: var(--white);
      border-bottom: 1px solid var(--border);
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .nav {
      max-width: 1200px;
      margin: auto;
      padding: 16px 22px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 21px;
      font-weight: 800;
      color: var(--green);
    }

    .logo-mark {
      width: 40px;
      height: 40px;
      border-radius: 10px;
      background: var(--green);
      color: white;
      display: grid;
      place-items: center;
      font-size: 20px;
    }

    nav {
      display: flex;
      gap: 25px;
      align-items: center;
    }

    nav a {
      text-decoration: none;
      color: #3e4944;
      font-size: 14px;
      font-weight: 600;
    }

    nav a:hover {
      color: var(--green);
    }

    .login-btn {
      background: var(--green);
      color: white !important;
      padding: 10px 18px;
      border-radius: 8px;
    }

    /* Hero */

    .hero {
      background:
        radial-gradient(circle at top right, #dff2e9 0, transparent 35%),
        linear-gradient(180deg, #ffffff 0%, #f3f9f6 100%);
      padding: 80px 22px 70px;
      text-align: center;
    }

    .badge {
      display: inline-block;
      background: var(--light-green);
      color: var(--green);
      padding: 7px 14px;
      border-radius: 30px;
      font-size: 13px;
      font-weight: 700;
      margin-bottom: 20px;
    }

    .hero h1 {
      font-size: clamp(36px, 6vw, 64px);
      line-height: 1.15;
      color: var(--dark-green);
      margin-bottom: 18px;
      font-weight: 850;
    }

    .hero h1 span {
      color: var(--green);
    }

    .hero p {
      max-width: 720px;
      margin: auto;
      color: var(--muted);
      font-size: 17px;
    }

    /* Search */

    .search-box {
      max-width: 720px;
      margin: 32px auto 0;
      background: white;
      padding: 8px;
      border: 1px solid var(--border);
      border-radius: 14px;
      display: flex;
      box-shadow: 0 12px 35px rgba(0, 80, 60, 0.08);
    }

    .search-box input {
      flex: 1;
      border: none;
      outline: none;
      padding: 15px;
      font-size: 15px;
      background: transparent;
    }

    .search-box button {
      border: none;
      background: var(--green);
      color: white;
      padding: 0 24px;
      border-radius: 9px;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
    }

    .search-box button:hover {
      background: var(--dark-green);
    }

    /* Stats */

    .stats {
      max-width: 1050px;
      margin: -20px auto 0;
      padding: 0 22px;
      position: relative;
    }

    .stats-grid {
      background: white;
      border: 1px solid var(--border);
      border-radius: 16px;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      overflow: hidden;
      box-shadow: 0 10px 30px rgba(0,0,0,0.05);
    }

    .stat {
      padding: 25px;
      text-align: center;
      border-right: 1px solid var(--border);
    }

    .stat:last-child {
      border-right: none;
    }

    .stat strong {
      display: block;
      font-size: 28px;
      color: var(--green);
    }

    .stat span {
      color: var(--muted);
      font-size: 13px;
    }

    /* Sections */

    .section {
      max-width: 1200px;
      margin: auto;
      padding: 75px 22px 20px;
    }

    .section-title {
      text-align: center;
      margin-bottom: 35px;
    }

    .section-title h2 {
      font-size: 30px;
      color: var(--dark-green);
      margin-bottom: 8px;
    }

    .section-title p {
      color: var(--muted);
    }

    /* Ministry Cards */

    .cards {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 18px;
    }

    .card {
      background: white;
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 24px;
      transition: 0.2s;
    }

    .card:hover {
      transform: translateY(-4px);
      box-shadow: 0 12px 25px rgba(0,0,0,0.07);
      border-color: #b9d9cc;
    }

    .card-icon {
      width: 45px;
      height: 45px;
      background: var(--light-green);
      color: var(--green);
      border-radius: 10px;
      display: grid;
      place-items: center;
      font-size: 21px;
      margin-bottom: 16px;
    }

    .card h3 {
      font-size: 17px;
      margin-bottom: 7px;
      color: #203029;
    }

    .card p {
      font-size: 13px;
      color: var(--muted);
    }

    /* Transparency */

    .transparency {
      max-width: 1200px;
      margin: 70px auto 0;
      padding: 0 22px;
    }

    .transparency-box {
      background: var(--dark-green);
      color: white;
      border-radius: 18px;
      padding: 45px;
      display: grid;
      grid-template-columns: 1.3fr 1fr;
      gap: 40px;
      align-items: center;
    }

    .transparency-box h2 {
      font-size: 30px;
      margin-bottom: 12px;
    }

    .transparency-box p {
      color: #d7e6e0;
    }

    .points {
      display: grid;
      gap: 12px;
    }

    .point {
      background: rgba(255,255,255,0.08);
      padding: 13px 15px;
      border-radius: 9px;
      font-size: 14px;
    }

    /* Notice */

    .notice {
      max-width: 1000px;
      margin: 55px auto;
      padding: 0 22px;
    }

    .notice-box {
      background: #fff9e8;
      border: 1px solid #f0dfaa;
      border-radius: 12px;
      padding: 20px;
      color: #62562e;
      font-size: 14px;
    }

    /* Footer */

    footer {
      margin-top: 80px;
      background: #10211b;
      color: #cbd8d3;
      padding: 40px 22px;
    }

    .footer-inner {
      max-width: 1200px;
      margin: auto;
      display: flex;
      justify-content: space-between;
      gap: 30px;
    }

    .footer-brand {
      color: white;
      font-size: 18px;
      font-weight: 800;
    }

    .footer-text {
      margin-top: 8px;
      max-width: 500px;
      font-size: 13px;
    }

    .copyright {
      text-align: center;
      margin-top: 30px;
      padding-top: 20px;
      border-top: 1px solid #294038;
      font-size: 12px;
    }

    /* Mobile */

    @media (max-width: 850px) {
      nav a:not(.login-btn) {
        display: none;
      }

      .cards {
        grid-template-columns: repeat(2, 1fr);
      }

      .transparency-box {
        grid-template-columns: 1fr;
      }
    }

    @media (max-width: 600px) {
      .hero {
        padding-top: 55px;
      }

      .search-box {
        flex-direction: column;
        padding: 7px;
      }

      .search-box button {
        padding: 13px;
      }

      .stats-grid {
        grid-template-columns: 1fr;
      }

      .stat {
        border-right: none;
        border-bottom: 1px solid var(--border);
      }

      .stat:last-child {
        border-bottom: none;
      }

      .
