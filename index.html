  /* =========================================================
     SAFE HTML
     ========================================================= */

  function escapeHtml(value) {

    if (value === null || value === undefined) {
      return "";
    }

    return String(value)
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;")
      .replace(/'/g, "&#039;");
  }


  /* =========================================================
     SAFE URL
     ========================================================= */

  function safeSourceUrl(value) {

    if (!value) {
      return "";
    }

    try {

      const url = new URL(String(value));

      if (
        url.protocol !== "https:" &&
        url.protocol !== "http:"
      ) {
        return "";
      }

      return url.href;

    } catch (error) {

      return "";

    }
  }


  /* =========================================================
     BANGLA NUMBER
     ========================================================= */

  function banglaNumber(value) {

    return String(value)
      .replace(/0/g, "০")
      .replace(/1/g, "১")
      .replace(/2/g, "২")
      .replace(/3/g, "৩")
      .replace(/4/g, "৪")
      .replace(/5/g, "৫")
      .replace(/6/g, "৬")
      .replace(/7/g, "৭")
      .replace(/8/g, "৮")
      .replace(/9/g, "৯");
  }


  /* =========================================================
     MONEY
     ========================================================= */

  function formatMoney(value) {

    const amount = Number(value);

    if (!Number.isFinite(amount)) {

      return currentLanguage === "bn"
        ? "উল্লেখ নেই"
        : "Not available";

    }

    const formatted =
      new Intl.NumberFormat(
        currentLanguage === "bn"
          ? "bn-BD"
          : "en-US"
      ).format(amount);

    return formatted +
      (
        currentLanguage === "bn"
          ? " টাকা"
          : " BDT"
      );
  }


  /* =========================================================
     YEAR
     ========================================================= */

  function formatYear(value) {

    const year = Number(value);

    if (!Number.isFinite(year)) {

      return currentLanguage === "bn"
        ? "উল্লেখ নেই"
        : "Not available";

    }

    return currentLanguage === "bn"
      ? banglaNumber(year)
      : String(year);
  }


  /* =========================================================
     DATE
     ========================================================= */

  function formatDate(value) {

    if (!value) {

      return currentLanguage === "bn"
        ? "উল্লেখ নেই"
        : "Not available";

    }

    try {

      const date = new Date(value);

      if (Number.isNaN(date.getTime())) {
        return escapeHtml(value);
      }

      return new Intl.DateTimeFormat(
        currentLanguage === "bn"
          ? "bn-BD"
          : "en-US",
        {
          year: "numeric",
          month: "long",
          day: "numeric"
        }
      ).format(date);

    } catch (error) {

      return escapeHtml(value);

    }
  }

  /* =========================================================

     ========================================================= */

  function getFinancialType(term) {

    const value =
      term.toLowerCase();


    if (
      value === "আয়" ||
      value === "আয়" ||
      value === "income"
    ) {
      return "income";
    }


    if (
      value === "সম্পদ" ||
      value === "asset" ||
      value === "assets"
    ) {
      return "asset";
    }


    if (
      value === "দায়" ||
      value === "দায়" ||
      value === "liability" ||
      value === "liabilities"
    ) {
      return "liability";
    }


    return null;
  }


  /* =========================================================
     GET OFFICIAL DETAILS
     ========================================================= */

  async function loadOfficialFinancialData(
    officer
  ) {

    const profileResult =
      await db
        .from("financial_profiles")
        .select(
          "id, official_id, income, assets_value, liabilities_value, report_year, verification_status, source, source_url"
        )
        .eq(
          "official_id",
          officer.id
        )
        .order(
          "report_year",
          {
            ascending:false
          }
        )
        .limit(1);


    const recordsResult =
      await db
        .from("financial_records")
        .select(
          "id, official_id, profile_id, type, amount, asset_type, source, source_url, publication_date, report_year, verification_status"
        )
        .eq(
          "official_id",
          officer.id
        )
        .order(
          "report_year",
          {
            ascending:false
          }
        )
        .order(
          "created_at",
          {
            ascending:false
          }
        );


    officer.financial_profile =
      profileResult.data &&
      profileResult.data.length
        ? profileResult.data[0]
        : null;


    officer.financial_records =
      recordsResult.data || [];


    return officer;

  }

        currentLanguage === "bn"

    }


    if (record.type === "liability") {

        currentLanguage === "bn"
          ? "দায়"
          : "Liability";

    }


    return `

      <div class="financial-item">

        <span class="financial-label">
          ${typeLabel}
        </span>

          ${formatMoney(record.amount)}

            font-size:12px;
            line-height:1.7;

        >

  /* =========================================================
     DISPLAY GLOBAL RESULTS
     ========================================================= */

  function displayGlobalResults(
    data
  ) {

    const section =
      document.getElementById(
        "searchResultsSection"
      );

    const container =
      document.getElementById(
        "searchResults"
      );


    if (!section || !container) {
      return;
    }


    section.style.display =
      "block";


    let html = "";


    /* MINISTRY */

    if (
      data.ministries &&
      data.ministries.length
    ) {

      html += `

        <div class="global-result-heading">

          ${
            currentLanguage === "bn"
              ? "মন্ত্রণালয়"
              : "Ministries"
          }

        </div>

        <div class="results-box">

          ${data.ministries
            .map(
              renderMinistry
            )
            .join("")
          }

        </div>

      `;

    }


    /* DEPARTMENT */

    if (
      data.departments &&
      data.departments.length
    ) {

      html += `

        <div class="global-result-heading">

          ${
            currentLanguage === "bn"
              ? "দপ্তর / অধিদপ্তর"
              : "Departments"
          }

        </div>

        <div class="results-box">

          ${data.departments
            .map(
              renderDepartment
            )
            .join("")
          }

        </div>

      `;

    }


    /* OFFICIAL */

    if (
      data.officials &&
      data.officials.length
    ) {

      html += `

        <div class="global-result-heading">

          ${
            currentLanguage === "bn"
              ? "কর্মকর্তা"
              : "Officials"
          }

        </div>

        <div class="results-box">

          ${data.officials
            .map(
              renderOfficial
            )
            .join("")
          }

        </div>

      `;

    }


    /* FINANCIAL */

    if (
      data.financial &&
      data.financial.length
    ) {

      html += `

        <div class="global-result-heading">

          ${
            currentLanguage === "bn"
              ? "আর্থিক তথ্য / উৎস"
              : "Financial information / sources"
          }

        </div>

        <div class="results-box">

          ${data.financial
            .map(function(item) {

              return renderFinancialSearchResult(
                item.record,
                item.official
              );

            })
            .join("")
          }

        </div>

      `;

    }


    if (!html) {

      html = `

        <div class="no-result">

          ${
            currentLanguage === "bn"
              ? "কোনো ফলাফল পাওয়া যায়নি। অন্য শব্দ বা অন্য Filter দিয়ে চেষ্টা করুন।"
              : "No results found. Try another search term or filter."
          }

        </div>

      `;

    }


    container.innerHTML =
      html;


    section.scrollIntoView({
      behavior:"smooth",
      block:"start"
    });

  }


  /* =========================================================
     GLOBAL SEARCH
     ========================================================= */

  async function searchOfficer() {

    if (!db) {

      showConnectionStatus(
        currentLanguage === "bn"
          ? "Supabase এখনো সংযুক্ত নয়।"
          : "Supabase is not connected.",
        "error"
      );

      return;
    }


    const input =
      document.getElementById(
        "searchInput"
      );

    const button =
      document.getElementById(
        "searchButton"
      );


    if (!input || !button) {
      return;
    }


    const value =
      input.value.trim();


    if (!value) {

      showConnectionStatus(
        currentLanguage === "bn"
          ? "অনুসন্ধানের জন্য কিছু লিখুন।"
          : "Please enter something to search.",
        "error"
      );

      input.focus();

      return;
    }


    const searchValue =
      value
        .replace(/[%_]/g, "")
        .trim()
        .slice(0, 100);


    if (!searchValue) {
      return;
    }


    button.disabled =
      true;


    button.textContent =
      currentLanguage === "bn"
        ? "খোঁজা হচ্ছে..."
        : "Searching...";


    showConnectionStatus("");


    const data = {

      ministries:[],
      departments:[],
      officials:[],
      financial:[]

    };


    try {

      const filter =
        currentSearchFilter;


      /* =====================================================
         1. MINISTRIES
         ===================================================== */

      if (
        filter === "all" ||
        filter === "ministry"
      ) {

        const result =
          await db
            .from("ministries")
            .select("id,name")
            .ilike(
              "name",
              "%" + searchValue + "%"
            )
            .limit(25);


        if (result.error) {
          console.error(
            "Ministry search:",
            result.error
          );
        } else {
          data.ministries =
            result.data || [];
        }

      }


      /* =====================================================
         2. DEPARTMENTS
         ===================================================== */

      if (
        filter === "all" ||
        filter === "department"
      ) {

        const result =
          await db
            .from("departments")
            .select(
              "id,name"
            )
            .ilike(
              "name",
              "%" + searchValue + "%"
            )
            .limit(25);


        if (result.error) {
          console.error(
            "Department search:",
            result.error
          );
        } else {
          data.departments =
            result.data || [];
        }

      }


      /* =====================================================
         3. OFFICIALS
         ===================================================== */

      if (
        filter === "all" ||
        filter === "official"
      ) {

        const nameResult =
          await db
            .from("officials")
            .select(
              "id,name,designation,department_id"
            )
            .ilike(
              "name",
              "%" + searchValue + "%"
            )
            .limit(25);


        const designationResult =
          await db
            .from("officials")
            .select(
              "id,name,designation,department_id"
            )
            .ilike(
              "designation",
              "%" + searchValue + "%"
            )
            .limit(25);


        const combined = [
          ...(nameResult.data || []),
          ...(designationResult.data || [])
        ];


        const unique =
          new Map();


        combined.forEach(
          function(officer) {
            unique.set(
              officer.id,
              officer
            );
          }
        );


        const officers =
          Array.from(
            unique.values()
          ).slice(0,25);


        const detailed =
          await Promise.all(
            officers.map(
              loadOfficialFinancialData
            )
          );


        data.officials =
          detailed;

      }


      /* =====================================================
         4. FINANCIAL + SOURCE
         ===================================================== */

      if (
        filter === "all" ||
        filter === "financial" ||
        filter === "source"
      ) {

        let records = [];


        const year =
          /^\d{4}$/.test(searchValue)
            ? Number(searchValue)
            : null;


        const financialType =
          getFinancialType(
            searchValue
          );


        /* YEAR */

        if (year) {

          const result =
            await db
              .from("financial_records")
              .select(
                "id,official_id,profile_id,type,amount,asset_type,source,source_url,publication_date,report_year,verification_status"
              )
              .eq(
                "report_year",
                year
              )
              .order(
                "created_at",
                {
                  ascending:false
                }
              )
              .limit(25);


          if (!result.error) {
            records =
              result.data || [];
          }

        }


        /* TYPE */

        else if (financialType) {

          const result =
            await db
              .from("financial_records")
              .select(
                "id,official_id,profile_id,type,amount,asset_type,source,source_url,publication_date,report_year,verification_status"
              )
              .eq(
                "type",
                financialType
              )
              .limit(25);


          if (!result.error) {
            records =
              result.data || [];
          }

        }


        /* SOURCE / ASSET TYPE */

        else {

          const sourceResult =
            await db
              .from("financial_records")
              .select(
                "id,official_id,profile_id,type,amount,asset_type,source,source_url,publication_date,report_year,verification_status"
              )
              .ilike(
                "source",
                "%" + searchValue + "%"
              )
              .limit(25);


          const assetResult =
            await db
              .from("financial_records")
              .select(
                "id,official_id,profile_id,type,amount,asset_type,source,source_url,publication_date,report_year,verification_status"
              )
              .ilike(
                "asset_type",
                "%" + searchValue + "%"
              )
              .limit(25);


          records = [
            ...(sourceResult.data || []),
            ...(assetResult.data || [])
          ];

        }


        /* UNIQUE RECORDS */

        const uniqueRecords =
          new Map();


        records.forEach(
          function(record) {

            uniqueRecords.set(
              record.id,
              record
            );

          }
        );


        records =
          Array.from(
            uniqueRecords.values()
          ).slice(0,25);


        /* OFFICIAL NAMES */

        if (records.length) {

          const officialIds =
            [
              ...new Set(
                records
                  .map(
                    r => r.official_id
                  )
                  .filter(Boolean)
              )
            ];


          let officials = [];


          if (officialIds.length) {

            const officialResult =
              await db
                .from("officials")
                .select(
                  "id,name,designation"
                )
                .in(
                  "id",
                  officialIds
                );


            officials =
              officialResult.data || [];

          }


          const officialMap =
            new Map();


          officials.forEach(
            function(official) {

              officialMap.set(
                official.id,
                official
              );

            }
          );


          data.financial =
            records.map(
              function(record) {

                return {

                  record:record,

                  official:
                    officialMap.get(
                      record.official_id
                    ) || null

                };

              }
            );

        }

      }


      displayGlobalResults(
        data
      );


    } catch (error) {

      console.error(
        "Global search error:",
        error
      );


      showConnectionStatus(
        currentLanguage === "bn"
          ? "অনুসন্ধানের সময় সমস্যা হয়েছে।"
          : "An error occurred during search.",
        "error"
      );


      displayGlobalResults({
        ministries:[],
        departments:[],
        officials:[],
        financial:[]
      });


    } finally {

      button.disabled =
        false;


      button.textContent =
        currentLanguage === "bn"
          ? "খুঁজুন"
          : "Search";

    }

  }

  /* =========================================================
     SUPABASE INITIALIZE
     ========================================================= */

  function initializeSupabase() {

    if (
      !window.supabase ||
      typeof window.supabase.createClient !==
        "function"
    ) {

      showConnectionStatus(
        currentLanguage === "bn"
          ? "Supabase library লোড হয়নি।"
          : "Supabase library could not be loaded.",
        "error"
      );

      return;

    }


    try {

      db =
        window.supabase.createClient(
          SUPABASE_URL,
          SUPABASE_PUBLISHABLE_KEY
        );


      showConnectionStatus(
        currentLanguage === "bn"
          ? "Supabase সংযুক্ত হয়েছে।"
          : "Supabase connected.",
        "success"
      );


      loadStatistics();

    } catch (error) {

      console.error(
        "Supabase initialization:",
        error
      );

      db = null;

      showConnectionStatus(
        currentLanguage === "bn"
          ? "Supabase সংযোগ তৈরি করা যায়নি।"
          : "Could not connect to Supabase.",
        "error"
      );

    }

  }


  /* =========================================================
     EVENTS
     ========================================================= */

  document.addEventListener(
    "DOMContentLoaded",
    function() {


      /* CURRENT YEAR */

      const currentYear =
        document.getElementById(
          "currentYear"
        );

      if (currentYear) {

        currentYear.textContent =
          new Date().getFullYear();

      }


      /* GLOBAL SEARCH UI */

      setupGlobalSearchUI();


      /* SEARCH BUTTON */

      const searchButton =
        document.getElementById(
          "searchButton"
        );

      const searchInput =
        document.getElementById(
          "searchInput"
        );


      if (searchButton) {

        searchButton.addEventListener(
          "click",
          searchOfficer
        );

      }


      if (searchInput) {

        searchInput.addEventListener(
          "keydown",
          function(event) {

            if (
              event.key === "Enter"
            ) {

              event.preventDefault();

              searchOfficer();

            }

          }
        );

      }


      /* LANGUAGE */

      const languageButton =
        document.getElementById(
          "languageButton"
        );


      if (languageButton) {

        languageButton.addEventListener(
          "click",
          function() {

            setLanguage(
              currentLanguage === "bn"
                ? "en"
                : "bn"
            );

          }
        );

      }


      /* INITIAL LANGUAGE */

      setLanguage(
        currentLanguage
      );


      /* SUPABASE */

      initializeSupabase();

    }
  );
